name: Enable GitHub Pages
on:
  push:
    paths:
      - ".github/workflows/enable-pages.yml"
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on Pages from main, root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=main" -f "source[path]=/" -f build_type=legacy || true
          gh api "repos/${GITHUB_REPOSITORY}/pages"
